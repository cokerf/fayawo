name: Build Fayawo WebAssembly physics milestone
on:
  push:
    branches: [main, feat/web-original-rigidbody]
    paths:
      - "web/**"
      - "src/vdrift/carbrake.cpp"
      - "src/vdrift/carclutch.cpp"
      - "src/vdrift/cartransmission.cpp"
      - "src/vdrift/carengine.cpp"
      - "src/vdrift/carengine.h"
      - "src/vdrift/carwheel.cpp"
      - "src/vdrift/carsuspension.cpp"
      - "src/vdrift/configfile.cpp"
      - "web/bullet_probe.cpp"
      - "src/vdrift/cartire.cpp"
      - "src/vdrift/cartire.h"
      - "src/vdrift/configfile.h"
      - "src/vdrift/carsuspension.h"
      - "src/vdrift/carwheel.h"
      - "src/vdrift/caraero.cpp"
      - "src/vdrift/carbrake.h"
      - "src/vdrift/caraero.h"
      - "src/vdrift/mathvector.h"
      - ".github/workflows/build-web.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.18'
      - name: Build real VDrift C++ as WebAssembly
        run: bash web/build.sh
      - name: Verify browser artifacts
        run: test -s site/bullet.js && test -s site/bullet.wasm && test -s site/rigidbody-ui.js && test -s site/index.html && test -s site/tire-plot.js && test -s site/physics.js && test -s site/physics.wasm && test -s site/assets/manifest.json && test -s site/assets/tires/asphalt.tire && test -s site/assets/cars/ES.car
      - uses: actions/upload-artifact@v4
        with:
          name: fayawo-browser-wasm-milestone
          path: site/
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile original VDrift components with native compiler
        run: |
          c++ -std=c++17 -O2 -DFAYAWO_WEB -I src/vdrift \
            web/physics_bridge.cpp web/original_rigidbody.cpp src/vdrift/carbrake.cpp src/vdrift/caraero.cpp \
            src/vdrift/carclutch.cpp src/vdrift/cartransmission.cpp \
            src/vdrift/carengine.cpp src/vdrift/carwheel.cpp src/vdrift/carsuspension.cpp src/vdrift/configfile.cpp src/vdrift/cartire.cpp \
            web/tests/physics_smoke.cpp -o /tmp/fayawo-physics-test
          /tmp/fayawo-physics-test
